<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة لو خيروك؟ - F3X GAMES</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0f19;
        }
        .option-box {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-box:hover {
            filter: brightness(1.08);
        }
        .progress-bar {
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulse-vs {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.18); }
        }
        .or-badge {
            animation: pulse-vs 1.8s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">

    <!-- Top Navigation Bar -->
    <div class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between p-4 bg-gradient-to-b from-black/90 via-black/40 to-transparent">
        <a href="/" class="flex items-center gap-2 bg-slate-900/90 hover:bg-slate-800 text-white border border-slate-700/80 px-4 py-2 rounded-xl text-sm font-bold backdrop-blur-md transition-all shadow-lg">
            <i class="fa-solid fa-arrow-right"></i>
            <span>الرئيسية</span>
        </a>

        <div class="flex items-center gap-2">
            <button id="voiceToggle" class="bg-slate-900/90 hover:bg-slate-800 text-white border border-slate-700/80 px-4 py-2 rounded-xl text-sm font-bold backdrop-blur-md flex items-center gap-2 transition-all shadow-lg">
                <i id="voiceIcon" class="fa-solid fa-volume-high text-amber-400"></i>
                <span id="voiceStatus">القارئ الصوتي: مفعل</span>
            </button>
        </div>
    </div>

    <!-- Main Game Split Layout -->
    <div class="relative flex-1 flex flex-col h-full">
        
        <!-- Red Option (Top Section) -->
        <div id="optionRed" onclick="makeChoice('red')" class="option-box relative flex-1 bg-gradient-to-b from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 cursor-pointer flex flex-col items-center justify-center p-6 text-white text-center overflow-hidden border-b-4 border-black/50">
            <div class="max-w-2xl flex flex-col items-center z-10">
                <div class="w-32 h-32 md:w-44 md:h-44 mb-4 rounded-3xl overflow-hidden border-4 border-white/30 shadow-2xl bg-black/40 flex items-center justify-center transform hover:scale-105 transition-transform">
                    <img id="imgRed" src="" alt="الخيار الأول" class="w-full h-full object-cover">
                </div>
                <h2 id="textRed" class="text-2xl md:text-4xl font-black drop-shadow-md leading-tight text-white tracking-wide">
                    جاري التحميل...
                </h2>
                
                <!-- Percentage Stats -->
                <div id="statsRed" class="hidden mt-4 bg-black/60 px-6 py-2 rounded-2xl border border-white/20 backdrop-blur-md shadow-2xl animate-bounce">
                    <span id="percentRed" class="text-3xl md:text-4xl font-black text-amber-400">0%</span>
                </div>
            </div>
            
            <!-- Dynamic Background Progress -->
            <div id="barRed" class="progress-bar absolute bottom-0 left-0 top-0 bg-black/40 w-0"></div>
        </div>

        <!-- Center Badge 'أو' -->
        <div class="or-badge absolute top-1/2 left-1/2 z-20 w-16 h-16 md:w-20 md:h-20 bg-slate-950 border-4 border-amber-400 text-white rounded-full flex items-center justify-center font-black text-xl md:text-2xl shadow-2xl">
            أو
        </div>

        <!-- Blue Option (Bottom Section) -->
        <div id="optionBlue" onclick="makeChoice('blue')" class="option-box relative flex-1 bg-gradient-to-b from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 cursor-pointer flex flex-col items-center justify-center p-6 text-white text-center overflow-hidden">
            <div class="max-w-2xl flex flex-col items-center z-10">
                <h2 id="textBlue" class="text-2xl md:text-4xl font-black drop-shadow-md leading-tight mb-4 text-white tracking-wide">
                    جاري التحميل...
                </h2>
                
                <!-- Percentage Stats -->
                <div id="statsBlue" class="hidden mb-4 bg-black/60 px-6 py-2 rounded-2xl border border-white/20 backdrop-blur-md shadow-2xl animate-bounce">
                    <span id="percentBlue" class="text-3xl md:text-4xl font-black text-amber-400">0%</span>
                </div>

                <div class="w-32 h-32 md:w-44 md:h-44 rounded-3xl overflow-hidden border-4 border-white/30 shadow-2xl bg-black/40 flex items-center justify-center transform hover:scale-105 transition-transform">
                    <img id="imgBlue" src="" alt="الخيار الثاني" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Dynamic Background Progress -->
            <div id="barBlue" class="progress-bar absolute bottom-0 left-0 top-0 bg-black/40 w-0"></div>
        </div>
    </div>

    <!-- Next Question Button Panel & Call-To-Action Banner -->
    <div id="nextPanel" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center gap-3 w-full max-w-md px-4">
        <!-- CTA Banner for Content Creators -->
        <div class="bg-slate-900/95 border border-amber-400/60 text-amber-300 text-xs md:text-sm font-bold px-4 py-2 rounded-2xl backdrop-blur-md text-center shadow-2xl animate-pulse">
            🔥 اشترك بالقناة واعمل منشن لثاني شخص في الواتساب الآن!
        </div>
        <button onclick="nextQuestion()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 hover:to-yellow-400 text-slate-950 font-black py-4 rounded-2xl text-lg md:text-xl shadow-2xl hover:scale-105 transition-all flex items-center justify-center gap-3 border-2 border-white/40">
            <span>التحدي التالي</span>
            <i class="fa-solid fa-circle-arrow-left"></i>
        </button>
    </div>

    <script>
        // بنك أفكار شامل ومتنوع جداً لتصوير الفيديوهات والتفاعلات
        const rawQuestions = [
            {
                redText: "عشاء فاخر مع كريستيانو رونالدو",
                redImg: "https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=600&auto=format&fit=crop",
                blueText: "تخرج مع ثاني شخص يظهر في الواتساب عندك",
                blueImg: "https://images.unsplash.com/photo-1614680376593-902f749f7cfc?q=80&w=600&auto=format&fit=crop",
                redPercent: 68, bluePercent: 32
            },
            {
                redText: "تشرب كوب عصير باذنجان غريب مقابل 5,000$",
                redImg: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?q=80&w=600&auto=format&fit=crop",
                blueText: "تفتح الصندوق الغامض وتخاطر بكل ما معك",
                blueImg: "https://images.unsplash.com/photo-1549465220-1a8b9238cd48?q=80&w=600&auto=format&fit=crop",
                redPercent: 41, bluePercent: 59
            },
            {
                redText: "تكسب 100,000$ بشرط تشترك بالقناة وتعمل لايك فوراً",
                redImg: "https://images.unsplash.com/photo-1561414927-6d86591d0c4f?q=80&w=600&auto=format&fit=crop",
                blueText: "ترفض المبلغ وترجع لبيتك بدون أي شيء",
                blueImg: "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?q=80&w=600&auto=format&fit=crop",
                redPercent: 94, bluePercent: 6
            },
            {
                redText: "تقابل اليوتيوبر IShowSpeed وتصور معاه فيديو",
                redImg: "https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600&auto=format&fit=crop",
                blueText: "تأخذ رحلة مدفوعة بالكامل لليابان مع صديقك المفضل",
                blueImg: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=600&auto=format&fit=crop",
                redPercent: 53, bluePercent: 47
            },
            {
                redText: "تأكل أحر فلفل حار في العالم بدون ما تشرب ماء لمدة ساعة",
                redImg: "https://images.unsplash.com/photo-1588252303782-cb80119abd6d?q=80&w=600&auto=format&fit=crop",
                blueText: "تعطي هاتفك للشخص الخامس في الواتساب لمدة يوم كامل",
                blueImg: "https://images.unsplash.com/photo-1512428559087-560fa5ceab42?q=80&w=600&auto=format&fit=crop",
                redPercent: 35, bluePercent: 65
            },
            {
                redText: "تمتلك القدرة على الاختفاء وقتما تشاء",
                redImg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop",
                blueText: "تمتلك القدرة على قراءة أفكار الآخرين",
                blueImg: "https://images.unsplash.com/photo-1507413245164-6160d8298b31?q=80&w=600&auto=format&fit=crop",
                redPercent: 51, bluePercent: 49
            },
            {
                redText: "تعيش سنة كاملة بدون إنترنت أو هاتف ذكي",
                redImg: "https://images.unsplash.com/photo-1500989145750-8a4a23375811?q=80&w=600&auto=format&fit=crop",
                blueText: "تعيش سنة كاملة بدون أن تأكل حلويات أو شوكولاتة",
                blueImg: "https://images.unsplash.com/photo-1581798459219-318e76aecc7b?q=80&w=600&auto=format&fit=crop",
                redPercent: 22, bluePercent: 78
            },
            {
                redText: "تكون أشهر يوتيوبر في العالم ولكن بدون أرباح",
                redImg: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?q=80&w=600&auto=format&fit=crop",
                blueText: "تكون مليونير ومجهول تماماً لا أحد يعرفك",
                blueImg: "https://images.unsplash.com/photo-1553729459-efe14ef6055d?q=80&w=600&auto=format&fit=crop",
                redPercent: 19, bluePercent: 81
            },
            {
                redText: "تبيت ليلة كاملة داخل منزل مهجور وغامض",
                redImg: "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?q=80&w=600&auto=format&fit=crop",
                blueText: "تقفز بالمظلة من أعلى قمة جبل في العالم",
                blueImg: "https://images.unsplash.com/photo-1521651201144-634f700b36ef?q=80&w=600&auto=format&fit=crop",
                redPercent: 44, bluePercent: 56
            },
            {
                redText: "تأكل وجبة تحتوي على حشرات مقلية مجففة",
                redImg: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?q=80&w=600&auto=format&fit=crop",
                blueText: "تستحم بماء مثلج في منتصف فصل الشتاء",
                blueImg: "https://images.unsplash.com/photo-1518002171953-a080ee817e1f?q=80&w=600&auto=format&fit=crop",
                redPercent: 28, bluePercent: 72
            }
        ];

        let questionsList = [];
        let currentIndex = 0;
        let isVoiceEnabled = true;
        let hasChosen = false;

        // خلط الأسئلة عشوائياً (Shuffle Array)
        function shuffleQuestions() {
            questionsList = [...rawQuestions].sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            hasChosen = false;

            if (currentIndex >= questionsList.length) {
                shuffleQuestions();
                currentIndex = 0;
            }

            const q = questionsList[currentIndex];

            document.getElementById('textRed').innerText = q.redText;
            document.getElementById('imgRed').src = q.redImg;
            document.getElementById('textBlue').innerText = q.blueText;
            document.getElementById('imgBlue').src = q.blueImg;

            // Reset UI States
            document.getElementById('statsRed').classList.add('hidden');
            document.getElementById('statsBlue').classList.add('hidden');
            document.getElementById('nextPanel').classList.add('hidden');
            document.getElementById('barRed').style.width = '0%';
            document.getElementById('barBlue').style.width = '0%';

            speakMaleVoice(`لو خيروك: ${q.redText}... أو... ${q.blueText}`);
        }

        // محرك نطق بالصوت الرجالي العربي (Male Arabic Speech Synthesis Engine)
        function speakMaleVoice(text) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.92; // سرعة القراءة
            utterance.pitch = 0.8; // خفض نبرة الصوت لتسريعه بصوت رجالي عميق

            const voices = window.speechSynthesis.getVoices();
            // البحث عن صوت عربي ذكوري مسجل بالنظام
            const maleVoice = voices.find(v => v.lang.includes('ar') && (
                v.name.toLowerCase().includes('male') || 
                v.name.toLowerCase().includes('naayf') || 
                v.name.toLowerCase().includes('maged') ||
                v.name.toLowerCase().includes('tarik') ||
                v.name.toLowerCase().includes('adam')
            )) || voices.find(v => v.lang.includes('ar'));

            if (maleVoice) utterance.voice = maleVoice;

            window.speechSynthesis.speak(utterance);
        }

        function makeChoice(choice) {
            if (hasChosen) return;
            hasChosen = true;

            const q = questionsList[currentIndex];
            document.getElementById('percentRed').innerText = q.redPercent + '%';
            document.getElementById('percentBlue').innerText = q.bluePercent + '%';

            document.getElementById('barRed').style.width = q.redPercent + '%';
            document.getElementById('barBlue').style.width = q.bluePercent + '%';

            document.getElementById('statsRed').classList.remove('hidden');
            document.getElementById('statsBlue').classList.remove('hidden');
            document.getElementById('nextPanel').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        document.getElementById('voiceToggle').addEventListener('click', () => {
            isVoiceEnabled = !isVoiceEnabled;
            document.getElementById('voiceStatus').innerText = isVoiceEnabled ? "القارئ الصوتي: مفعل" : "القارئ الصوتي: مكتوم";
            document.getElementById('voiceIcon').className = isVoiceEnabled ? "fa-solid fa-volume-high text-amber-400" : "fa-solid fa-volume-xmark text-slate-500";
            if (!isVoiceEnabled) {
                window.speechSynthesis.cancel();
            } else {
                const q = questionsList[currentIndex];
                speakMaleVoice(`لو خيروك: ${q.redText}... أو... ${q.blueText}`);
            }
        });

        // Ensure voices are loaded properly in browser
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                if (questionsList.length > 0) {
                    const q = questionsList[currentIndex];
                    speakMaleVoice(`لو خيروك: ${q.redText}... أو... ${q.blueText}`);
                }
            };
        }

        // Initialize Game On Load
        window.onload = () => {
            shuffleQuestions();
            loadQuestion();
        };
    </script>
</body>
</html>
